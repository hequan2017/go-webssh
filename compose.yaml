services:
  bastion:
    build:
      context: .
    image: go-webssh-bastion:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      BASTION_ADMIN_USER: "${BASTION_ADMIN_USER:-admin}"
      BASTION_ADMIN_PASSWORD: "${BASTION_ADMIN_PASSWORD:?set BASTION_ADMIN_PASSWORD in .env}"
      BASTION_SESSION_HOURS: "${BASTION_SESSION_HOURS:-12}"
      BASTION_MAX_UPLOAD_MB: "${BASTION_MAX_UPLOAD_MB:-100}"
    volumes:
      - bastion-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bastion-data:
