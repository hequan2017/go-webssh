<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebSSH</title>
    <link href="/static/css/xterm.min.css" rel="stylesheet" type="text/css"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
        }
        .terminal {
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="terminal"></div>
<script src="/static/js/xterm.min.js"></script>
<script>
    var cols = 120, rows = 32;
    var params = new URLSearchParams(window.location.search);
    if (params.get('cols')) cols = parseInt(params.get('cols'));
    if (params.get('rows')) rows = parseInt(params.get('rows'));

    var term = new Terminal({cursorBlink: true, cols: cols, rows: rows});
    term.open(document.getElementById('terminal'));

    var socket = new WebSocket(
        (location.protocol === 'https:' ? 'wss://' : 'ws://') +
        window.location.host + '/ws/1?cols=' + cols + '&rows=' + rows
    );

    term.on('data', function (data) {
        socket.send(data);
    });

    socket.onmessage = function (msg) {
        term.write(msg.data);
    };

    socket.onerror = function (e) {
        console.error('WebSocket error:', e);
    };

    socket.onclose = function (e) {
        term.writeln('\r\n\x1b[31m连接已关闭\x1b[0m');
    };

    window.addEventListener('resize', function () {
        // 简易 resize：获取终端可见行列数并通知后端
        if (term.proposeGeometry) {
            var geometry = term.proposeGeometry();
            if (geometry) {
                socket.send(JSON.stringify({
                    type: 'resize',
                    cols: geometry.cols,
                    rows: geometry.rows
                }));
            }
        }
    });
</script>
</body>
</html>
