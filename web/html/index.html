<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="go-webssh-mode" content="server">
  <title>go-webssh Bastion</title>
  <link rel="icon" href="./static/img/favicon.png">
  <link rel="stylesheet" href="./static/css/xterm.min.css">
  <link rel="stylesheet" href="./static/css/app.css">
</head>
<body>
  <section id="login-view" class="login-view">
    <div class="login-card">
      <div class="login-brand"><span class="brand-mark">&gt;_</span><div><strong>go-webssh</strong><small>Bastion Host</small></div></div>
      <h1>登录跳板机</h1>
      <p>统一访问受管 SSH 资产，所有连接和文件操作均进入审计。</p>
      <form id="login-form" class="form-stack">
        <label>用户名<input id="login-username" name="username" autocomplete="username" required></label>
        <label>密码<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button button-primary button-block" type="submit">登录</button>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">&gt;_</span><div><strong>go-webssh</strong><small>安全访问控制台</small></div></div>
      <nav id="navigation" class="navigation" aria-label="主导航">
        <button data-view="dashboard" class="nav-item active">概览</button>
        <button data-view="assets" class="nav-item">资产管理</button>
        <button data-view="credentials" data-roles="admin" class="nav-item">凭据管理</button>
        <button data-view="users" data-roles="admin" class="nav-item">用户与权限</button>
        <button data-view="sessions" data-roles="admin,auditor" class="nav-item">会话记录</button>
        <button data-view="audits" data-roles="admin,auditor" class="nav-item">审计日志</button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span>服务运行中</span></div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div><button id="menu-toggle" class="icon-button" type="button" aria-label="切换导航">☰</button><h1 id="page-title">概览</h1></div>
        <div class="user-menu"><span id="demo-badge" class="badge badge-info" hidden>静态演示</span><span id="current-user"></span><button id="change-password" class="button" type="button">修改密码</button><button id="logout" class="button" type="button">退出</button></div>
      </header>
      <main id="content" class="content" tabindex="-1"></main>
    </section>
  </div>

  <dialog id="modal" class="modal">
    <form id="modal-form" method="dialog">
      <header><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" type="button" aria-label="关闭">×</button></header>
      <div id="modal-body" class="modal-body"></div>
      <p id="modal-error" class="form-error" role="alert"></p>
      <footer><button id="modal-cancel" class="button" type="button">取消</button><button class="button button-primary" type="submit">保存</button></footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./static/js/xterm.min.js"></script>
  <script src="./static/js/app.js"></script>
</body>
</html>
